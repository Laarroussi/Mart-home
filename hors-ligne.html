<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marfan APA — connexion perdue</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:linear-gradient(140deg,#0b1530,#0e7490); color:#fff; padding:24px;
           font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .boite { max-width:460px; text-align:center; }
    img { width:72px; height:72px; border-radius:18px; margin-bottom:18px; }
    h1 { font-size:21px; margin:0 0 10px; }
    p { font-size:14px; line-height:1.7; color:#cffafe; margin:0 0 10px; }
    button { margin-top:18px; padding:12px 24px; border:none; border-radius:10px; cursor:pointer;
             background:#fff; color:#0e7490; font-size:14px; font-weight:700; }
  </style>
</head>
<body>
  <div class="boite">
    <img src="icones/icone-192.png" alt="">
    <h1>Pas de connexion</h1>
    <p>L'application a besoin d'internet : la visioconférence, votre dossier et
       l'enregistrement de la séance passent tous par le serveur.</p>
    <p>Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
