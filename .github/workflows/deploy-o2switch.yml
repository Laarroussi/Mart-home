name: Deploy to o2switch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o2switch-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate secrets
        env:
          O2_HOST: ${{ secrets.O2_HOST }}
          O2_USER: ${{ secrets.O2_USER }}
          O2_PORT: ${{ secrets.O2_PORT }}
          O2_PATH: ${{ secrets.O2_PATH }}
          O2_SSH_KEY: ${{ secrets.O2_SSH_KEY }}
          O2_CPANEL_TOKEN: ${{ secrets.O2_CPANEL_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Vérification des secrets nécessaires..."

          test -n "${O2_HOST:-}" || (echo "::error::O2_HOST est vide ou absent" && exit 1)
          test -n "${O2_USER:-}" || (echo "::error::O2_USER est vide ou absent" && exit 1)
          test -n "${O2_PORT:-}" || (echo "::error::O2_PORT est vide ou absent" && exit 1)
          test -n "${O2_PATH:-}" || (echo "::error::O2_PATH est vide ou absent" && exit 1)
          test -n "${O2_SSH_KEY:-}" || (echo "::error::O2_SSH_KEY est vide ou absent" && exit 1)
          test -n "${O2_CPANEL_TOKEN:-}" || (echo "::error::O2_CPANEL_TOKEN est vide ou absent" && exit 1)

          case "$O2_PORT" in
            ''|*[!0-9]*)
              echo "::error::O2_PORT doit être un nombre. Pour o2switch, utilisez 22."
              exit 1
              ;;
          esac

          if [ "$O2_PORT" != "22" ]; then
            echo "::warning::O2_PORT vaut $O2_PORT. Chez o2switch, le SSH est normalement sur le port 22."
          fi

          case "$O2_PATH" in
            /home/jost2290/public_html/marfantraining|/home/jost2290/public_html/marfantraining/)
              echo "O2_PATH correspond au dossier cible attendu."
              ;;
            *)
              echo "::error::O2_PATH ne correspond pas au dossier cible attendu."
              echo "Valeur attendue : /home/jost2290/public_html/marfantraining"
              exit 1
              ;;
          esac

          echo "Secrets présents. Les valeurs sensibles ne sont pas affichées."

      - name: Whitelist GitHub Actions runner IP on o2switch
        env:
          O2_HOST: ${{ secrets.O2_HOST }}
          O2_USER: ${{ secrets.O2_USER }}
          O2_PORT: ${{ secrets.O2_PORT }}
          O2_CPANEL_TOKEN: ${{ secrets.O2_CPANEL_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::add-mask::$O2_CPANEL_TOKEN"

          echo "Détection de l'IPv4 publique temporaire du runner GitHub Actions..."
          RUNNER_IPV4="$(curl -4 -fsS --max-time 15 https://api.ipify.org)"

          if [ -z "$RUNNER_IPV4" ]; then
            echo "::error::Impossible de détecter l'IPv4 publique du runner GitHub Actions."
            exit 1
          fi

          echo "IPv4 temporaire du runner : $RUNNER_IPV4"
          echo "RUNNER_IPV4=$RUNNER_IPV4" >> "$GITHUB_ENV"

          echo ""
          echo "Ajout de cette IP à la liste blanche SSH o2switch..."
          echo "Aucun mot de passe ni token ne sera affiché."

          curl -sS -m 45 \
            -H "Authorization: cpanel $O2_USER:$O2_CPANEL_TOKEN" \
            "https://$O2_HOST:2083/execute/SshWhitelist/add?address=$RUNNER_IPV4&port=$O2_PORT" \
            > /tmp/o2-whitelist-add.json

          echo "Réponse o2switch pour l'ajout à la liste blanche :"
          cat /tmp/o2-whitelist-add.json
          echo ""

          if grep -q '"status"[[:space:]]*:[[:space:]]*1' /tmp/o2-whitelist-add.json; then
            echo "o2switch indique que la demande de liste blanche est acceptée."
          else
            echo "::error::L'ajout de l'IP à la liste blanche o2switch n'a pas été confirmé."
            echo "Causes possibles : token cPanel incorrect, limite de 5 exceptions atteinte, ou accès API refusé."
            exit 1
          fi

          echo ""
          echo "Vérification que le port SSH devient accessible depuis GitHub Actions..."

          TCP_OK=0

          for attempt in 1 2 3 4 5 6; do
            echo "Tentative TCP $attempt/6 vers $O2_HOST:$O2_PORT..."

            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$O2_HOST/$O2_PORT" 2>/tmp/tcp-after-whitelist.err; then
              TCP_OK=1
              echo "TCP OK : le port SSH est maintenant accessible depuis GitHub Actions."
              break
            fi

            echo "Pas encore accessible. Pause de 10 secondes..."
            sleep 10
          done

          if [ "$TCP_OK" != "1" ]; then
            echo "::error::Le port SSH reste inaccessible après l'ajout en liste blanche."
            echo "Message bas niveau éventuel :"
            cat /tmp/tcp-after-whitelist.err || true
            echo ""
            echo "À vérifier :"
            echo "- le token O2_CPANEL_TOKEN est-il bien un token API cPanel ?"
            echo "- la limite de 5 exceptions o2switch est-elle atteinte ?"
            echo "- le port O2_PORT est-il bien 22 ?"
            exit 1
          fi

      - name: Configure SSH
        env:
          O2_SSH_KEY: ${{ secrets.O2_SSH_KEY }}
          O2_HOST: ${{ secrets.O2_HOST }}
          O2_PORT: ${{ secrets.O2_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Préparation du dossier SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "Écriture de la clé privée SSH dans le runner GitHub Actions..."
          printf '%s\n' "$O2_SSH_KEY" > ~/.ssh/o2switch_key
          chmod 600 ~/.ssh/o2switch_key

          echo "Vérification du format BEGIN / END de la clé privée..."
          if ! head -n 1 ~/.ssh/o2switch_key | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "::error::O2_SSH_KEY ne commence pas par BEGIN OPENSSH PRIVATE KEY."
            exit 1
          fi

          if ! tail -n 1 ~/.ssh/o2switch_key | grep -q "END OPENSSH PRIVATE KEY"; then
            echo "::error::O2_SSH_KEY ne se termine pas par END OPENSSH PRIVATE KEY."
            exit 1
          fi

          echo "Vérification que OpenSSH peut lire la clé privée..."
          if ! ssh-keygen -y -f ~/.ssh/o2switch_key > /dev/null 2>/tmp/keycheck.err; then
            echo "::error::OpenSSH ne peut pas lire la clé privée."
            cat /tmp/keycheck.err || true
            exit 1
          fi

          echo "Clé privée présente et lisible. Son contenu n'est pas affiché."

          echo ""
          echo "Récupération de la clé publique du serveur avec ssh-keyscan..."
          rm -f /tmp/keyscan.out /tmp/keyscan.err

          set +e
          ssh-keyscan -T 30 -p "$O2_PORT" -t ed25519,rsa,ecdsa "$O2_HOST" > /tmp/keyscan.out 2> /tmp/keyscan.err
          SCAN_RC=$?
          set -e

          echo "Code retour ssh-keyscan : $SCAN_RC"
          echo "Messages ssh-keyscan :"
          sed 's/^/[ssh-keyscan] /' /tmp/keyscan.err || true

          if [ -s /tmp/keyscan.out ]; then
            cat /tmp/keyscan.out >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "known_hosts alimenté avec succès."
            echo "Nombre de lignes ajoutées : $(wc -l < /tmp/keyscan.out)"
          else
            echo "::error::ssh-keyscan n'a retourné aucune clé d'hôte."
            echo "Si cette erreur revient, le problème est encore réseau / pare-feu / port."
            exit 1
          fi

      - name: Test SSH connection
        env:
          O2_HOST: ${{ secrets.O2_HOST }}
          O2_USER: ${{ secrets.O2_USER }}
          O2_PORT: ${{ secrets.O2_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Test de connexion SSH non interactive..."
          echo "La clé privée ne sera pas affichée."

          ssh \
            -i ~/.ssh/o2switch_key \
            -p "$O2_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$O2_USER@$O2_HOST" \
            "echo Connexion SSH OK"

      - name: Ensure target folder exists
        env:
          O2_HOST: ${{ secrets.O2_HOST }}
          O2_USER: ${{ secrets.O2_USER }}
          O2_PORT: ${{ secrets.O2_PORT }}
          O2_PATH: ${{ secrets.O2_PATH }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Vérification du dossier cible..."

          case "$O2_PATH" in
            /home/jost2290/public_html/marfantraining|/home/jost2290/public_html/marfantraining/)
              ;;
            *)
              echo "::error::O2_PATH inattendu. Déploiement interrompu par sécurité."
              exit 1
              ;;
          esac

          ssh \
            -i ~/.ssh/o2switch_key \
            -p "$O2_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$O2_USER@$O2_HOST" \
            "mkdir -p '$O2_PATH' && test -d '$O2_PATH' && ls -ld '$O2_PATH'"

          echo "Dossier cible OK."

      - name: Deploy files to o2switch
        env:
          O2_HOST: ${{ secrets.O2_HOST }}
          O2_USER: ${{ secrets.O2_USER }}
          O2_PORT: ${{ secrets.O2_PORT }}
          O2_PATH: ${{ secrets.O2_PATH }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Déploiement rsync vers o2switch..."
          echo "Dossier cible : $O2_PATH"
          echo "Aucune clé privée ne sera affichée."
          echo "Sécurité : ce premier rsync ne supprime pas les anciens fichiers distants."

          case "$O2_PATH" in
            /home/jost2290/public_html/marfantraining|/home/jost2290/public_html/marfantraining/)
              ;;
            *)
              echo "::error::O2_PATH inattendu. Déploiement interrompu par sécurité."
              exit 1
              ;;
          esac

          rsync -avz \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".cpanel.yml" \
            --exclude ".env" \
            --exclude ".DS_Store" \
            --exclude "README.md" \
            --exclude "github_actions_o2switch" \
            --exclude "github_actions_o2switch.pub" \
            -e "ssh -i ~/.ssh/o2switch_key -p $O2_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$O2_USER@$O2_HOST:$O2_PATH/"

          echo "Déploiement terminé."

      - name: Restart Node.js application (Passenger)
        env:
          O2_HOST: ${{ secrets.O2_HOST }}
          O2_USER: ${{ secrets.O2_USER }}
          O2_PORT: ${{ secrets.O2_PORT }}
          O2_PATH: ${{ secrets.O2_PATH }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Sans ce redémarrage, Passenger continue d'exécuter l'ANCIEN code backend
          # déjà chargé en mémoire : les fichiers sont à jour sur le disque mais les
          # corrections des routes ne prennent jamais effet.
          echo "Redémarrage de l'application Node.js via le fichier Passenger restart.txt..."

          ssh \
            -i ~/.ssh/o2switch_key \
            -p "$O2_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$O2_USER@$O2_HOST" \
            "mkdir -p '$O2_PATH/backend/tmp' && touch '$O2_PATH/backend/tmp/restart.txt' && ls -l '$O2_PATH/backend/tmp/restart.txt'"

          echo "Attente de 8 secondes le temps que l'application redémarre..."
          sleep 8

          echo "Vérification de l'état de l'API..."
          HTTP_CODE="$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 https://marfan-sport-sante.fr/api/health || echo '000')"
          echo "Code HTTP /api/health : $HTTP_CODE"
          cat /tmp/health.json 2>/dev/null || true
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::L'API n'a pas répondu 200 après le redémarrage (code $HTTP_CODE). Vérifiez cPanel → Setup Node.js App."
          else
            echo "API opérationnelle après redémarrage."
          fi

      - name: Remove temporary runner IP from o2switch whitelist
        if: always()
        env:
          O2_HOST: ${{ secrets.O2_HOST }}
          O2_USER: ${{ secrets.O2_USER }}
          O2_PORT: ${{ secrets.O2_PORT }}
          O2_CPANEL_TOKEN: ${{ secrets.O2_CPANEL_TOKEN }}
          RUNNER_IPV4: ${{ env.RUNNER_IPV4 }}
        shell: bash
        run: |
          set +e

          echo "::add-mask::$O2_CPANEL_TOKEN"

          if [ -z "${RUNNER_IPV4:-}" ]; then
            echo "Aucune IP temporaire de runner à retirer."
            exit 0
          fi

          if [ -z "${O2_CPANEL_TOKEN:-}" ]; then
            echo "Token cPanel absent, nettoyage impossible."
            exit 0
          fi

          echo "Nettoyage de l'IP temporaire du runner dans la liste blanche o2switch : $RUNNER_IPV4"
          echo "Cette étape ne doit jamais afficher le token."

          curl -sS -m 45 \
            -H "Authorization: cpanel $O2_USER:$O2_CPANEL_TOKEN" \
            "https://$O2_HOST:2083/execute/SshWhitelist/remove?address=$RUNNER_IPV4&port=$O2_PORT&direction=in" \
            > /tmp/o2-whitelist-remove-in.json

          curl -sS -m 45 \
            -H "Authorization: cpanel $O2_USER:$O2_CPANEL_TOKEN" \
            "https://$O2_HOST:2083/execute/SshWhitelist/remove?address=$RUNNER_IPV4&port=$O2_PORT&direction=out" \
            > /tmp/o2-whitelist-remove-out.json

          echo "Réponse suppression direction in :"
          cat /tmp/o2-whitelist-remove-in.json
          echo ""

          echo "Réponse suppression direction out :"
          cat /tmp/o2-whitelist-remove-out.json
          echo ""

          echo "Nettoyage terminé ou demandé."
